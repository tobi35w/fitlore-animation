name: Daily FitLore Video Automation

on:
  schedule:
    # 13:00 UTC is 14:00 WAT (2:00 PM Africa/Lagos)
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run end-to-end verification test'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  produce-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: claude-animated-shorts/package-lock.json

      - name: Install System Dependencies for Linux Rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libasound2 libgbm1 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libxkbcommon0 chromium-browser

      - name: Install Node Dependencies
        working-directory: claude-animated-shorts
        run: npm ci

      - name: Install Python Dependencies (Kokoro TTS, Audio & Publisher)
        run: |
          python -m pip install --upgrade pip
          pip install kokoro soundfile numpy scipy torch requests python-dotenv

      - name: Configure Cloud Environment
        run: |
          echo "REMOTION_BROWSER_EXECUTABLE=/usr/bin/chromium-browser" >> $GITHUB_ENV
          echo "PUBLISH_MODE=schedule" >> $GITHUB_ENV
          echo "AUTO_PUBLISH=true" >> $GITHUB_ENV
          echo "DRY_RUN=false" >> $GITHUB_ENV
          echo "SCHEDULEPOST_API_KEY=${{ secrets.SCHEDULEPOST_API_KEY }}" >> $GITHUB_ENV

      - name: Execute Daily Video Production & Scheduling
        run: |
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            python scripts/produce_and_schedule.py --test
          else
            python scripts/produce_and_schedule.py
          fi

      - name: Commit & Push Updated History and Receipts
        if: ${{ github.event_name == 'schedule' || inputs.test_mode == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FITLORE_VIDEO_LIBRARY.json "Rendered Videos"/*.json "Rendered Videos"/*.srt claude-animated-shorts/projects/
          if ! git diff --staged --quiet; then
            git commit -m "chore(automation): record completed video and SchedulePost receipt [skip ci]"
            git push
          fi
